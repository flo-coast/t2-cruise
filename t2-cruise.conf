# /etc/t2-cruise.conf (restart after changes: sudo systemctl restart t2-cruise)

# apple     = do what macOS does: MSLC caps the CPU, MSLG caps the GPU (recommended)
# adaptive  = EXPERIMENTAL: split MSLC between CPU and GPU by GPU load
# Switch at runtime without restart: echo adaptive | sudo tee /run/t2-cruise/policy
POLICY=apple

# CPU: one MSLC step lowers the CPU ceiling by this much, never below CPU_MIN_MHZ
#CPU_MIN_MHZ=800
#CPU_STEP_MHZ=100

# GPU: one MSLG step lowers the Radeon power cap by this much (needs an unlocked cap)
#GPU_STEP_W=2.5

# adaptive policy tuning
#ADAPTIVE_GPU_FLOOR_W=25
#ADAPTIVE_GPU_STEP_W=1.25
#ADAPTIVE_CPU_FLOOR_MHZ=1600
#ADAPTIVE_BUSY_GPU_BOUND=95
#ADAPTIVE_BUSY_CPU_BOUND=70
#ADAPTIVE_BUSY_TAU=5.0
